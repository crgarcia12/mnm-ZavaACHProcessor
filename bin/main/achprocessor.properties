rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.vhost=/zavabank
rabbitmq.events.exchange=zava.events
rabbitmq.deadletter.exchange=zava.dlx
rabbitmq.ach.routingKey=ach.processed
rabbitmq.ach.failure.routingKey=ach.failed

ach.incoming.path=/shared/ach-incoming
ach.processed.path=/shared/ach-incoming/processed
ach.error.path=/shared/ach-incoming/error
ach.poll.interval.ms=5000

ledger.url=http://zavaledger:8080
ledger.ach.endpoint=/api/ledger/ach
http.timeout.ms=15000
